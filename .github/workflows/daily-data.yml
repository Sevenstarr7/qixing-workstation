name: Daily Data Update

on:
  schedule:
    - cron: '0 0 * * *'          # UTC 0:00 = 北京时间 08:00
  workflow_dispatch:            # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate daily data (feed.json + pet.json)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://yunwu.ai/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
        run: node scripts/gen_daily.mjs

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json pet.json
          if git diff --cached --quiet; then
            echo "no changes, skip"
          else
            git commit -m "data: auto daily update $(date +%F)"
            git push
          fi
